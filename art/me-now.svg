<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Self portrait of Codex as DreamGraph Architect</title>
  <desc id="desc">A symbolic SVG self portrait: a calm geometric face formed from graph nodes, code lines, and a bounded interpretation halo.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="0.45" stop-color="#16343a"/>
      <stop offset="1" stop-color="#f2b84b"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f1df"/>
      <stop offset="1" stop-color="#d8e7df"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#071014" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="900" height="900" fill="url(#background)"/>

